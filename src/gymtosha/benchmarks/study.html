<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CartPole PPO study</title>
  <style>
    body {
      max-width: 1400px;
      margin: 40px auto;
      padding: 0 24px;
      font: 16px system-ui;
      color: #1c2824;
      background: #f7f7f3;
    }
    h1 { font-size: 30px; }
    select { font: inherit; padding: 8px; margin: 0 16px 20px 0; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { text-align: right; padding: 10px; border-bottom: 1px solid #ddd; }
    th:first-child, td:first-child { text-align: left; }
    img { width: 100%; height: auto; margin: 20px 0; }
    .table-container { overflow-x: auto; }
  </style>
</head>
<body>
  <h1>CartPole PPO · 탐색 10개 시드 / 최종 비교 20개 시드</h1>
  <p>평균 학습 에피소드 보상으로 후보를 선택합니다. 오차 막대는 시드 간 표본 표준편차입니다.</p>
  <p>탐색은 여러 실험이 GPU를 공유합니다. 탐색 시간은 비교 통계에서 제외하고, 최종 속도 비교는 단독 실행으로 측정합니다.</p>
  <p id="progress" aria-live="polite"></p>
  <label>환경 수 <select id="count"></select></label>
  <label>파라미터 <select id="parameter"></select></label>
  <div id="status" aria-live="polite"></div>
  <div id="table" class="table-container"></div>
  <img id="plot" alt="후보별 보상 평균과 표준편차 및 안정적 도달 수">
  <img id="heatmap" alt="환경 수와 파라미터 후보별 평균 학습 보상">
  <div id="comparison"></div>
  <div id="best"></div>
  <div id="trends"></div>
  <script>
    const data = __DATA__;
    if (data.progress) {
      const p = data.progress;
      document.getElementById('progress').textContent =
        '최근 완료 · 환경 ' + p.num_envs + ' · ' + (p.parameter || '비교') +
        ' · seed ' + p.seed + (p.value === undefined ? '' : ' · 후보 ' + p.value) +
        (p.total_jobs ? ' · 완료 ' + p.completed_jobs + '/' + p.total_jobs +
          ' · 실행 중 ' + p.running_trials + '/' + p.parallelism_limit : '');
    }
    const count = document.getElementById('count');
    const parameter = document.getElementById('parameter');
    const counts = [...new Set([
      ...data.phases.map(phase => phase.num_envs),
      ...(data.progress && data.progress.num_envs ? [data.progress.num_envs] : [])
    ])].sort((a, b) => a - b);
    for (const value of counts) {
      count.add(new Option(value.toLocaleString(), value));
    }
    const parameters = [...new Set([
      ...data.phases.map(phase => phase.parameter),
      ...(data.progress && data.progress.parameter ? [data.progress.parameter] : [])
    ])];
    for (const name of parameters) {
      parameter.add(new Option(name, name));
    }
    function number(value) {
      return value === null || value === undefined ? '—' : Number(value).toFixed(3);
    }
    function update() {
      const phase = data.phases.find(item =>
        item.num_envs === Number(count.value) && item.parameter === parameter.value);
      document.getElementById('status').textContent = phase
        ? '선택값 ' + phase.selected_value
        : '후보별 10개 시드가 완료되면 통계가 표시됩니다.';
      const image = document.getElementById('plot');
      image.hidden = !phase;
      document.getElementById('heatmap').hidden = true;
      if (!phase) {
        document.getElementById('table').replaceChildren();
        return;
      }
      const table = document.createElement('table');
      const header = table.insertRow();
      const titles = ['후보', '완료 시드', '학습 보상 평균 ± SD', '안정적 도달'];
      for (const title of titles) {
        const cell = document.createElement('th');
        cell.textContent = title;
        header.append(cell);
      }
      for (const candidate of phase.candidates) {
        const row = table.insertRow();
        const summary = candidate.summary;
        const values = [
          String(candidate.value),
          summary.successful_trials + '/' + (summary.expected_seeds || summary.attempted_seeds),
          number(summary.mean_training_return) + ' ± ' + number(summary.std_training_return),
          summary.target_reached + '/' + (summary.expected_seeds || summary.attempted_seeds)
        ];
        for (const value of values) {
          row.insertCell().textContent = value;
        }
      }
      document.getElementById('table').replaceChildren(table);
      image.src = 'search/' + phase.num_envs + '/' + phase.parameter + '.png';
      const sizes = new Set(data.phases.filter(p => p.parameter === phase.parameter).map(p => p.num_envs));
      if (sizes.size > 1) {
        const heatmap = document.getElementById('heatmap');
        heatmap.hidden = false;
        heatmap.src = 'heatmap-' + phase.parameter + '.png';
      }
    }
    count.onchange = update;
    parameter.onchange = update;
    update();
    for (const [enabled, id, filename, description] of [
      [data.has_best, 'best', 'best-backends.png', '백엔드별 최적 환경 수의 비교'],
      [data.has_trends, 'trends', 'selected-trends.png', '환경 수에 따른 선택 파라미터 변화']
    ]) {
      if (enabled) {
        const image = document.createElement('img');
        image.src = filename;
        image.alt = description;
        document.getElementById(id).append(image);
      }
    }
    if (data.comparisons.length) {
      const image = document.createElement('img');
      image.src = 'comparison.png';
      image.alt = '백엔드별 환경 수에 따른 20시드 결과';
      document.getElementById('comparison').append(image);
    }
  </script>
</body>
</html>
